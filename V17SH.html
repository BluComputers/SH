<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poetry Collection - Volume 18</title>
    <style>
        :root {
            --volume-color: #fce4ec; /* Light pink for Volume 18 */
            --accent-pink: #d81b60;
            --text-dark: #2c3e50;
            --overlay-bg: #ffffff;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Georgia', serif;
            background-color: var(--volume-color);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .poem-tile {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .poem-tile:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .image-placeholder {
            width: 100%;
            height: 200px;
            background: #f8bbd0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #880e4f;
            font-style: italic;
            border-bottom: 1px solid #eee;
            text-align: center;
            padding: 10px;
        }

        .tile-title {
            padding: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-dark);
        }

        .poem-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            z-index: 1000;
            overflow-y: auto;
            padding: 60px 20px;
            box-sizing: border-box;
        }

        .poem-content {
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
            line-height: 1.8;
            font-size: 1.3rem;
            white-space: pre-line;
            color: #222;
        }

        .close-btn {
            position: fixed;
            top: 25px;
            right: 35px;
            font-size: 2.5rem;
            cursor: pointer;
            color: var(--text-dark);
            font-weight: bold;
        }

        h2 { 
            margin-bottom: 30px; 
            color: var(--accent-pink); 
            font-size: 2.2rem;
            border-bottom: 2px solid var(--volume-color);
            display: inline-block;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="gallery" id="gallery"></div>

    <div id="overlay" class="poem-overlay">
        <span class="close-btn" onclick="closePoem()">&times;</span>
        <div id="full-poem-view" class="poem-content"></div>
    </div>

    <script>
        const poems = [
            {
                title: "I've always had you",
                body: `My earliest memories are full of your smile
You,d hide your face in your hands then say "boo!"
And somehow i just knew i was safe
I was certain because i had you

The hours we spent baking cakes, having fun
Learning so much as i grew
Such happy times i,ll cherish forever
Made perfect because i had you

Those holiday car rides with you and dad
Loving glances shared between you two
Singsongs and i spy to help us along
Nothing else mattered because i had you

You always had time for all of my friends
Many days i,d turn up with a crew
Lemonade, sandwiches and biscuits galore
We were happy because we had you

When boyfriends arrived you were my guide
Always there for the times i felt blue
A hug from you was all i would need
No one could hurt me because i had you

Your words of encouragement the day i left home
Time to paddle my own canoe
I knew you were only a phone call away
Nothing scared me because i had you

Best friends and sisters thats what we were
Although days spent together were few
But i knew i was always there in your mind
In my heart i knew i,d always have you

Then a phone call one day. I ran to your side
The doctors all said that you knew
How could this be? You were slipping away
How could i face life without you?

And then you were gone. Now just me and dad
Who were we meant to turn to?
Our reason to be had been taken away
More than ever now i needed you

Then came the day we all said goodbye
It felt unreal as i sat in my pew
A different life starting. I had to step up
Try to guide us through life without you

I try so hard to do my best
Live my life like you wanted me to
And i hope you are watching. I hope you are proud
Hope i am half as good as you

From my window i watch as the years roll round
See seasons colours changing their hue
And i,m thankful for this life you gave me
And proud to have shared it with you

This eternal bond we will share forever
Mother and daughter a love so true
Our candle burns on in the darkest of days
Deep in my heart now i carry you

And now in the dawn hours you come to me
Our love is discovered anew
And i smile at the realisation
All along i have always had you`

            {
                title: "Christmas",
                body: `When the witches and monsters have all filled their buckets,
And the firework crackles are few;
The happiest time of the year now approaches,
As Christmas comes into view.

The panic of realising there’s only six weeks—
Cards to buy, to write and to send;
Try to remember who sent one last year,
Hope you haven’t forgotten a friend.

The ads on the TV all scream at the children:
"Mum, I want this! Dad, I want that!"
And you think back to your day when you were happy
With a doll or a ball and a bat.

The November houses twinkle and shine,
People shake their heads as they pass by;
"Too early," they say, "there’s five weeks to go!"—
It’ll be here in the blink of an eye.

Children make lists and post them to Santa,
Mums and dads hope he’s on strike;
Then the frantic worry of trying to save
For a laptop or a new bike.

As schools close, the parents are telling the children:
"Santa’s watching, so you need to be good."
Mum starts to shop; the turkey is bought,
The dreaded sprouts and the Christmas pud.

The magic of buying a real Christmas tree,
New decorations and a glittering star;
And the laughter at Dad as he wrestles with branches—
"Damn thing won’t fit in the car!"

Home, and Dad has a beer for the tree,
"Family tradition," he says every year;
Then the big switch-on and gasps of delight,
Thoughts turn to those we hold dear.

The Salvation Army band play in the town,
Santa’s grotto glows with little ones' joy;
It’s Christmas Eve—he’s on his way!—
Wishing and hoping he brings that toy.

Mum and Dad hug, they’ve done it again,
Somehow the magic has happened once more;
And they head off to bed for a four-hour sleep,
Till little heads pop around their door.

Knee-deep in paper, Dad cradles his coffee,
Tries to doze through the chaos and din;
Mum’s off to the kitchen, a dinner to cook—
Is it ever too early for gin?

All over the country the scene is repeated,
Empty chairs remind us of Christmases past;
A time for love, a time to forgive,
A time to be together at last.

Dad watches the Queen then drifts off to sleep,
Dorothy follows her yellow brick road;
Mum finally sits down, her long day is done—
All is perfect in this happy abode.

We dread it, we love it, it lasts just a day,
And it’s all about family and love;
Remember the reason, remember the child
Sent to earth from the heavens above.

And so I’ll sign off these few festive lines,
With love and a heartfelt plea:
Be with me always, my beautiful friends,
Merry Christmas from Lisa and me. xx`

            {
                title: " Liverpool ",
                body: `Of all the places I have been,
All the cities I learned in school,
One place stands tall above the rest—
Her name is Liverpool.

With open arms she took me in,
Kept me safe beneath her wing;
Taught me values, taught me strength,
Taught my heart to sing.

The mighty Mersey laps her shores,
The world all sing her songs;
The privilege of being there,
The feeling you belong.

Where four lads shook the music world,
It’s still shaking to this day;
You’ll never drive this city down,
She’ll always have her say.

In my mind I’ll take a walk
Around this place that I called home;
A place that keeps you company,
Where you never walk alone.

Across Stanley Park, the red and blue,
Rivalries that never stop;
Football royalty, a century old,
The roars of Gwladys Street and the Kop.

A wander now down Mathew Street,
The tourists stand in awe;
This is where it all began,
On that sweaty cellar floor.

The nights I spent in that tiny road,
I’ve danced and sang all night;
The vibrant heart of a city so proud,
Many times till morning’s light.

If you’re sad she’ll make you smile,
Drag you howling off the floor;
Tickling sticks and Diddy men,
Laugh till your ribs are sore.

Atop the Cathedral, oh what a view,
There’s a peace and a silence up there;
Look down on her splendor, this city of love,
Her soul and her spirit laid bare.

Down at the pier, the Three Graces soar,
The Liver birds stand guard from on high;
Symbols of a city so mighty and proud,
She’s been down but she’ll never die.

Ninety-seven angels shine down on this place,
She fought for their names and she won;
They picked the wrong city—she never gives up,
Fight every second till justice is done.

Jamie and Rhys, the children she lost,
Their beautiful spirits live on;
A heartbroken town remembers forever,
Red and blue came together as one.

If you’ve never been, then you just can’t know
How she gets inside your heart;
And I am proud to know her,
Too long we’ve been apart.

So thank you, Liverpool, for loving me,
Thanks for the laughs and the craic;
And one day soon, if you’ll have me,
I’ll travel that sweet road back.`

            {
                title: "Love me tender ",
                body: `Tears full of memories roll down her cheeks,
For five minutes she’ll take a short break;
A little oasis, a chance to look back,
Not sure how much more she can take.

She thinks back and smiles at those black-and-white days,
When he wooed her and wouldn’t take no;
The kisses and cuddles in freezing cold bus stops,
He promised he’d never let go.

She laughs to herself as she remembers the time
She took him home to the family for tea;
They didn’t approve—"do much better," they said,
"Plenty more fish in the sea."

The day they were married, her dad held her hand,
Finally accepting, he gave her away;
A life just beginning, "till death do us part,"
Now the guilt as she dreams of that day.

Winter fireside nights they spent dancing to Elvis:
"Love me tender, love me sweet, never let me go;
You have made my life complete,
And I love you so."

Through the good times and bad they were there for each other,
Brought up children and made a nice home;
It all went so fast, now back to just two,
She never imagined she’d feel so alone.

They talked about buying a holiday cottage,
A chance to unwind, clear the mind;
With one thing and another it just never happened—
Just these four walls and this daily grind.

Two years ago she noticed him changing:
Forgot his keys, let the bath overflow;
Didn’t worry at first, age does that to us all,
With time we are all bound to slow.

Then came the day she found him in tears,
Sat on the stairs with fear in his eyes;
They sat there for hours, he held on like a child,
Till sleep gently banished his cries.

Doctors all shook their heads and said sorry:
"It’ll be gradual, he’ll need round-the-clock care."
Then the heartbreak of telling the family,
Desperate news she did not want to share.

People stopped to say sorry—she wanted to scream:
"He’s not dead! He’s just different," she’d say.
Then home to her man like she’s always done,
Close the door, outside world kept away.

Some days he screams at her, some days he cries,
Some days he thinks she’s his mam;
But every day she sees another piece of him die—
Where once was a lion, now a lamb.

She knows that one day they’ll take him away,
And she’ll visit each day, sit and chat;
Try to reach inside his stolen mind,
Try to remind him of this and that.

Now out of her daydream she takes him his tray,
He looks peaceful as he naps in his chair;
She wonders what places he visits in sleep,
She wishes she too could be there.

She puts on the record, the voice takes her back,
He smiles at the tune he knows well;
A few precious moments together again,
Back in their heaven, away from the hell.

Slowly they dance, teenagers once more,
They cry as they roll back the years;
Back to those days when he wouldn’t take no,
Days full of hope, dreams, and fears.

As the song fades away she whispers "thank you,
Thank you for being mine;
I’ll be yours through all the years,
Till the end of time.`

                title: "The Soldier's Place",
                body: `A soldier went to heaven,
St. Peter at the gate;
He stood in line with other men,
Each resigned to their fate.

His turn came and Peter smiled:
"Welcome to heaven, my son;
I know you’re young and frightened,
But now your final battle is won."

"I know you’ve been through hell, young man,
But now you’ll find some peace;
Up here you will find only love,
Here all tensions cease."

"Please feel free to look around,
I think you’ll like it here;
You’ll find old friends and family,
All the folk you held so dear."

So on he walked across the clouds,
And angels stood and bowed;
In the distance, a light—he had to know
What secrets and treasures it showed.

The light he found above a door,
He nervously stepped inside;
Rows and rows of soldiers
Saluted him with pride.

A Sergeant Major stepped forward:
"Stand easy now, lad. Time to rest;
You gave your all. You made us proud,
We all know you did only your best."

"Now lead this battalion, lad. March us on,
It’s time to meet your God;"
And rows and rows of soldiers
Marched where thousands before had trod.

And as they marched they sang a song
Of home and dreams of old;
Their medals gleaming in the sun,
An army so brave and so bold.

At last they stopped and angels beckoned them to sit,
A chair for every soldier—all but one;
And there in glory on his throne sat God himself,
Arms open for a soldier stood alone.

"Welcome home, my son," God said,
"You sacrificed so much;
But now with me you’ll live forever,"
He gently blessed him with his touch.

"But Lord, I have a question—there is no chair for me;
Do I stand alone forever in this place?
After all I did, is this to be my fate?"
Then a smile danced across God’s face.

God said, "You know my only son gave his life for peace,
And today you have done the very same;
And one day the world will be at peace,
One day the world will know your name."

"Those children that you guided to safety yesterday,
Their future is now safe because of you;
You did so much. And now I’ve brought you home,
Away from the evil that men do."

"Heroes like you, son, don’t come along each day,
You can search the whole world far and wide;
And the reason, son, why there is no chair for you,
Is that your place is here by my side.`

Blue skies, wispy clouds passing by;
And I’m trying to remember the good times,
So I’ll chat to you here where I lie.

They say it all flashes in front of your eyes,
Your whole life in a second of time;
I can see it so clearly—such happy days,
Lakes I swam and the hills that I’d climb.

Remember our street, Mam? Remember the games?
British Bulldog and Tag? Blind Man’s Buff?
Knock-on-and-run? They never caught me—
Somehow you managed to give us enough.

Times were hard, we were hungry, never complained;
You grafted and slaved, fed us all.
And I promised to give you the life you deserved,
Till I answered my country’s call.

Training was tough, Mam, but friends got me through,
All great lads and eighteen like me;
Then they brought us all here to this hell on earth,
To fight an enemy we can’t even see.

Digging for days in the mud and the worms,
Building trenches—"Keep your heads down!" Sarge said.
It’s hard work but we do it; this place is now home

They wake us at five, "Stand to arms" is the call,

Then dawn breaks, we all breathe a sigh of relief,
Then it’s bacon and rations of rum.

On my watch nights I think only of you, Mam,
I know you worry about your little lad;
I still carry your picture, it’s close to my heart,
You’re with me through good times and bad.

Did you get my letter? I sent it last month,
I hope it gave you some hope and a smile;
I’m trying to keep safe, longing for home—
God willing, I’ll be there in a while.

How’s life at home, Mam? I miss my old room,
A comfy bed seems a lifetime away;
An hour of sleep is so precious here—
Little escapes, keep the gunfire at bay.

I had to do my bit, Mam,
I know you cried as I marched away;
And I said I’d soon be back in your arms,
But I’m breaking that promise today.

This barbed wire has got me, Mam, I can’t get away,
Nobody’s coming for me;
I’ll hang on as long as I can for you, Mam,
Till my spirit is ready to fly free.

Then I’ll soar over these battlefields,
Shine down on my comrades so brave;
And one day I’ll smile down at a world
That’s found the calm and the peace we all crave.

Don't weep for me, Mam, I had to do this,
For my King and my country I stand;
You will stay in my heart forever,
I’ll never forget the touch of your hand.

This field will be my resting place,
And the poppies will mark where I lie;
One day the grass will banish the mud,
One day the last man will die.

This pointless war is over for me, Mam,
Guns are silent, I’m ready to fly;
Be proud of your lad—I gave it my best,
For now, it’s time for goodbye.

Know that I’ll always be with you,
This squaddie will march by your side;
And I’ll turn to your beautiful face, Mam,
Full of love and bursting with pride.`

            {
                title: "Little pink memories ",
                body: `The house is quiet, it’s dark and still,
And I know this is journey’s end;
So tonight I’ll remember my time on earth,
And my life as man’s best friend.

The darkness doesn’t bother an old boy like me,
I was the bravest of my little pack;
My master knew all was safe in the home,
All my life I’ve been at their back.

My earliest memory is the scent of my mum,
Snuggled up tight away from the chill;
Blind battles for milk, but she always made sure
Each one of us had our fill.

I remember the day I was taken away,
I cried for my mum—she looked sad.
Where was I going? I shivered with fear,
This was different from the life I had.

Wrapped in a blanket, I could hear voices,
They sounded happy. Were they kind? Is this home?
But I needn’t have worried—wow, what a place!
Now I knew I would never be alone.

So this was my pack: Mum, Dad, and three kids,
And the fuss they all made of me!
The little one was rough, pulled my whiskers and tail—
Oh, the happy days I spent with those three.

Early morning walks, just the master and me,
Those were such happy, carefree days;
The hills we climbed, the beaches I ran,
We walked all the tracks and the ways.

Beach walks were the best, I felt the wind in my face,
Master telling me, "Don’t run so far!"
Covered in mud, I’d come trotting back,
The shake of his head as I got in the car.

Home for a bath—catch me if you can!
I’m off and the chase is on!
Round couches and chairs, under tables and beds,
Till I let them think that they’ve won.

Now to be the good boy, feel the warmth of the shower,
Take my bath for a quiet life’s sake;
And then the best bit—are you ready, kids?
My secret weapon: an almighty shake!

As the years went by, the children grew,
Didn’t have time for the games anymore;
They seemed to have new friends, new places to go,
There was always a knock at the door.

It’s been a great life, I’ve got no complaints,
I’ve been loved and I’ve given love back;
But the days are growing shorter now,
I’m walking my final track.

I don’t want them around me, I don’t want the tears,
By the time they all wake, I’ll be gone;
But I’ll leave them my spirit and a lifetime of memories,
I’ll make sure they are never alone.

Master, you can’t come with me on this final walk,
And it doesn’t matter if I roll in the mud;
But treasure my memory and know that you gave me
A life that was noble and good.

The scent of my mum—I can smell it again,
This rainbow will be my last hill;
Reunited at last, and I’ll tell her my tale,
Snuggled up tight away from the chill.`

            {
                title: "The secret",
                body: `Still dark outside, it’s 6am,
He’s had about an hour;
Another day on autopilot,
Another shave, another shower.

He stares at the face in the mirror,
He looks older every day;
But time is paused—he hasn’t moved on
Since the day she went away.

His wife asleep, gets dressed in the dark,
Gently kisses her head as she dreams;
This day, like all days, he’ll put on a face,
Pretend everything’s as good as it seems.

He hates the silence of the early hours,
It should be filled with a happier noise;
She should be calling him, "Time to get up!
Daddy, play with me and my toys."

He takes off the key he keeps round his neck,
Quietly opens her unicorn room;
Kneels by the bed where his princess should be,
He can still smell the homemade perfume.

Downstairs for coffee, can’t face any food,
Watches the news—kids have died in a fire;
He cries for the family, he knows how it feels,
Those parents now share his desire.

They’ll share his dark place and his desperate grief,
That feeling, "I should’ve been there."
Hard-wired to protect and keep them safe,
It’s all so desperately unfair.

She’d been with her Nanna that terrible day,
Joy riders—too fast—stolen car;
A phone call at work, life shattered forever,
Now a permanent, unhealing scar.

Prison for them and prison for him,
Trapped in this never-ending cycle of pain;
He’s thought about joining her so many times,
Memories slowly drive him insane.

He has his marriage, but what does he say?
Neither know how the other is coping;
Never daring to laugh—"How can we now?"
Friends urge them to live again and keep hoping.

It feels like existence, a day-to-day toil,
His whole reason to live has now gone;
He worries that one day her image will fade,
Little pink memories help him plough on.

And so it is evening, and just as before,
He reads to her as if she’s still there;
Sometimes the Gruffalo, but tonight a treat—
Her favourite, Paddington Bear.

The teddies stare blankly as he glances around,
He wonders if they miss her too;
He should give them to charity but he can’t let them go,
They belong here—what else can he do?

He whispers "night night" as he closes the door,
Another day done, locks the memories away;
Closes his eyes as he searches for sleep,
Trying to keep the nightmares at bay.

Another day dawns, he lies awake,
She’s in his head every minute, every hour;
Another day on autopilot,
Another shave, another shower.`

            {
                title: "The Case in the Attic",
                body: `He smiles as he thinks of the weekend to come,
Finally he’s getting a chance;
House to himself, wife away,
Time to dress and time to dance.

He thinks of the clothes he’ll wear on the night,
He thinks of the people he’ll meet;
Good friends like him, all in the same boat,
One night only—a freedom so sweet.

Finally it’s here and his wife is ready,
Leaves her list of the things she wants done;
A kiss and he watches her car disappear,
She’s gone. Time for her. Time for fun.

Upstairs to the attic he brings down the case,
Takes a dress, holds it close to his face;
The scent still there from last time he wore it,
Time to go to that happier place.

He sits in front of his wife’s mirror,
For better or worse—not today;
It’s time to work magic, it’s time to be free,
Time for this mouse to go out and play.

Makeup applied and wig set just right,
Perfume on, favourite heels on his feet;
Runs his hands down his body, feels the dress smooth and tight,
She is born. Transformation complete.

Arrangements are made and it’s off into town,
She draws stares. People laugh. She feels small;
One day she prays she’ll do this full time,
On that day she knows she’ll stand tall.

Safe in the bar now with friends just like her,
Dance and drink to a life without fear;
His world is forgotten for those few golden hours,
Till reality whispers in his ear.

This Cinderella knows she must leave now,
Cold air hits and she nearly falls down;
Loses a sense of direction and suddenly finds
Herself in a strange part of town.

She staggers down streets looking for signs,
Landmarks to show her the way;
"Maybe this alleyway—it’s dark but I’ll try,"
Choices made and prices to pay.

Because now she hears whispers, now she sees faces,
Contorted with hatred and spite;
Laughter and taunting, a push and a shove,
They dare her to stand there and fight.

Now come the kicks and the blows from all sides,
All she can do is curl up and wait;
This is it. Life is over. She closes her eyes,
Darkness comes. She’s resigned to her fate.

Swollen eyes try to open. The lights are so bright,
His body aches from his feet to his head;
The realisation of what’s now to come:
His wife at his hospital bed.

They pass her a bag. "These are his clothes."
She cries and he turns from her gaze;
"Where do we go from here?" she asks,
He sees only desperate days.

We never know what hides behind a closed door,
Or the secrets that people may bare;
All I know is that kindness costs nothing to give—
Lose the hate. Gain the love and the care`

Downloaded Strava and walking miles on beaches,
Staggering back exhausted to our door.

Boris, oh Boris, old Tom’s walking round his garden,
A hundred times to help the nurses out;
Did you even notice he’s a hundred years old?
He’ll live longer in the memory, there’s no doubt.

Boris, oh Boris, you’re lying in the hospital,
You’ve caught the Rona shaking all those hands;
A nation holds its breath, we all wish the best for you—
A world on hold, nobody making plans.

Boris, oh Boris, Dominic’s been to Durham,
And now he’s in your garden telling lies;
But you won’t sack him because he runs the country—
Apparently, he had to test his eyes!

Boris, oh Boris, we need to form a bubble,
I can walk round Lidl but cannot see my dad;
Your rules seem to change every single day—
So very far away from the life we had.

Boris, oh Boris, finally some hope,
We’re "eating out to help out" down the pub;
I can’t help wondering, won’t that spread the virus,
As we all sit shovelling down our grub?

Boris, oh Boris, you’ve divided up the country,
Now we’re all in tiers, one to three;
Rules are being broken, I think we’ve had enough,
We all need to get our lives back and be free.

Boris, oh Boris, Christmas has been cancelled,
And now the anger really starts to spread;
You seem to give with one hand then take away again,
And now we have a hundred thousand dead.

Boris, oh Boris, at last some happy news,
People are queuing for a jab;
The old folk first while rumours come from China—
This may have all started in their lab.

Boris, oh Boris, now you have a reshuffle,
Replacing those who failed with much the same;
Our death toll is the highest in all of Europe,
Surely you must shoulder a share of blame.

Boris, oh Boris, life goes on for you,
And you probably think you’ve really done your bit;
Maybe on occasion you might just spare a thought
For the 230,000 souls who didn’t make it.`
            }
        ];

        function renderGallery() {
            const container = document.getElementById('gallery');
            container.innerHTML = poems.map((p, index) => `
                <div class="poem-tile" onclick="openPoem(${index})">
                    <div class="image-placeholder">Illustration for "${p.title}"</div>
                    <div class="tile-title">${p.title}</div>
                </div>
            `).join('');
        }

        function openPoem(index) {
            const poem = poems[index];
            const view = document.getElementById('full-poem-view');
            view.innerHTML = `<h2>${poem.title}</h2><br>${poem.body}`;
            document.getElementById('overlay').style.display = 'block';
            document.body.style.overflow = 'hidden'; 
        }

        function closePoem() {
            document.getElementById('overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        renderGallery();
    </script>
</body>
</html>
