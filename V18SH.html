<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poetry Collection - Volume 19</title>
    <style>
        :root {
            --volume-color: #e3f2fd; /* Soft Blue for Volume 19 */
            --accent-blue: #1976d2;
            --text-dark: #2c3e50;
            --overlay-bg: #ffffff;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Georgia', serif;
            background-color: var(--volume-color);
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .poem-tile {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .poem-tile:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .image-placeholder {
            width: 100%;
            height: 200px;
            background: #bbdefb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0d47a1;
            font-style: italic;
            border-bottom: 1px solid #eee;
            text-align: center;
            padding: 10px;
        }

        .tile-title {
            padding: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--text-dark);
        }

        .poem-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--overlay-bg);
            z-index: 1000;
            overflow-y: auto;
            padding: 60px 20px;
            box-sizing: border-box;
        }

        .poem-content {
            max-width: 700px;
            margin: 0 auto;
            text-align: center;
            line-height: 1.8;
            font-size: 1.3rem;
            white-space: pre-line;
            color: #222;
        }

        .close-btn {
            position: fixed;
            top: 25px;
            right: 35px;
            font-size: 2.5rem;
            cursor: pointer;
            color: var(--text-dark);
            font-weight: bold;
        }

        h2 { 
            margin-bottom: 30px; 
            color: var(--accent-blue); 
            font-size: 2.2rem;
            border-bottom: 2px solid var(--volume-color);
            display: inline-block;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="gallery" id="gallery"></div>

    <div id="overlay" class="poem-overlay">
        <span class="close-btn" onclick="closePoem()">&times;</span>
        <div id="full-poem-view" class="poem-content"></div>
    </div>

    <script>
        const poems = [
            {
                title: "For Matthew Shepard",
                body: `I didn’t know you, Matthew,
I really wish I had;
I imagine you were full of life,
A beautiful young lad.

I came across your story
By chance the other night,
And it filled me with such sadness
You inspired me to write.

Twenty-three years have passed since then,
Have attitudes changed? I’m not sure.
Nobody should ever suffer again
That terrible pain you endured.

They say you knew the people who hurt you,
That you’d do drugs and drink and fight;
But those are no excuses
For your suffering on that night.

I close my eyes and try to imagine
The blows raining down on your face,
Tied to a fence, unable to run—
Your final memory will be of that place.

In every blow, a spit of hatred,
An ignorance we see every day;
They probably laughed as they snuffed out your life,
A price paid for being gay.

What went through your mind as you hung on that fence?
I imagine all your life’s hopes and fears;
Your last taste of life was the blood on your face,
And the salt from your final tears.

They say your face was covered in blood,
Apart from tear tracks, one on each cheek;
You must’ve wept for your mum—I know I would,
My first thought when times are bleak.

Matthew, I’m sorry for my species,
And that I hadn’t heard your name;
Your suffering on that awful night
Is our eternal shame.

But I promise I’ll remember now,
To keep you in my mind;
To fight for rights for everyone,
Be humble and be kind.

If heaven’s real, then one day, Matt,
I’d love to be your mate,
And tell you how the world is better,
And free from pain and hate.

But for now, sleep well and rest your soul,
Safe now, away from that place;
I’ll meet you one day and hopefully I’ll get
A smile from that beautiful face.`
            },
            {
                title: "The Joy of My Life",
                body: `How many of us can say for sure
We’ve found true love just once?
I know I have, and in her eyes
She gives me her response.

For this is not a physical love;
It is destined, it is meant.
The kind of love found only in dreams,
It’s surely heaven-sent.

I wondered what my purpose was,
My reason to be here,
But then one day my whole world changed
And it all became so clear.

A broken soul had crossed my path,
Her eyes so full of fear;
I gently led her home with me
To all I held so dear.

How many would say they’d do the same—
Take a stranger into your home?
But I saw emptiness in those eyes,
I couldn’t leave her alone.

She wore the only clothes she had:
Skin and bone and pain.
It broke my heart and I swore then,
She’ll never suffer again.

That pain was mental and physical,
Bruised from head to toe;
Abused for years by a man she loved,
This time she’d had to go.

And so I started to rebuild,
Gave her confidence each day;
Space to heal, to grow, to love,
To slowly find her way.

And slowly, like a butterfly,
I watched her be reborn—
Still so scared and fragile,
But stronger with each dawn.

Our little bubble grew stronger each day,
We’d cry and laugh and dance,
And I’d cast my mind back to that day
When fate gave us our chance.

The rollercoaster of our life,
The highs and desperate lows,
Have created an unbreakable bond;
Together we face life’s blows.

As I write this, I look up and glance across
At my princess, safe and sound;
An exchange of smiles, a knowing look—
A paradise we’ve found.

I’ve never known a love like this,
A closeness so very rare;
And I will love her always,
My life is hers to share.

And so I’ll sign these few lines off
To Lisa, through troubles and strife:
We did it together and, baby, guess what?
You truly are the joy of my life.`
            },
            {
                title: "If I Could",
                body: `If I could change perceptions,
I promise I would try;
I’d open eyes and minds and hearts—
No need to live that lie.

If I could give you childhood back,
I promise that I would;
Being different would be fine,
Feel the feelings that you should.

If I could write a fairy tale—
Mirror, mirror on the wall—
You’d see only a princess staring back,
No more tears would fall.

If I could walk you down the street,
We’d do it heads held high;
How proud I’d be to see you shine,
Folk would smile as we passed by.

If I could bring you to my home,
My door would open wide;
No judgment here, just friendship,
And endless love and pride.

If I could take away the bullies,
I promise that I’d fight;
Wipe your tears with my bare hands,
Defend you with all my might.

If I could make a wish come true,
I’d clear all minds of hate;
Your world would be a better place,
Safe beyond your garden gate.

If I could make you happy,
I promise that’s my aim;
To see you live a perfect life,
Free from hate and pain.

If I could guide you through the darkness,
I’d shine my light so bright;
Carry you home along life’s roads,
Hold your hand so tight.

If I could write a song for you,
I promise that I’d sing
Of happy days and beautiful dreams,
And what tomorrow brings.

If I could tell you just four words,
From my heart I swear it’s true;
I’d look you in the eyes and say:
"Forever I’ll love you."

If I could be your friend forever,
I promise you just this:
My love for you is endless,
I send to each of you a kiss. x`
            },
            {
                title: "The Secret Girl",
                body: `6am alarm clock rings
He rubs his eyes awake
Another day of missing her
Another day feeling a fake
He stares into the bathroom mirror
She stares back with empty eyes
Aftershave instead of perfume
He hangs his head and sighs
No need for wigs or makeup
Hair combed he,s dressed and ready
To face the world to tell his lies
To be reliable and steady
Downstairs to breakfast he sits and smiles
Loves his family. He,s so full of pride
But he has a secret and they cant know
The turmoil that rages inside
Onto the bus he checks out the ladies
Nice colour, would look good on me
Admires the makeup and hairstyles
One day i,ll show them they,ll see
He works all day but in his mind
She whispers in his ear
She wants to be out. He needs her there
That voice is oh so clear
So home again he goes to family
Upstairs to change to shower
His eyes catch a glimpse of the suitcase
They know nothing of its power
For in that case live all his dreams
The life he craves so much
Those clothes are her. They give her life
He,s desperate for their touch
One day he thinks the world wont hate
One day i,ll do it they,ll see
One day i,ll walk head high down the street
One day i,ll truly be me
But for now under the bed she must stay
In her suitcase all folded and neat
Till the world catches up and opens its arms
And smells the aroma of perfume so sweet
He lies in the darkness reaches under the bed
Feels the lock on the case closed tight
He whispers "sweet dreams " to his secret girl
Turns and kisses his wife goodnight`
            },
            {
                title: " Facebook!!",
                body: `Happy to chat and make friends it says
And i,m grateful for all those that do
So here,s a rhyme about a typical week
And the chats between me and you
I still get the buzz when i first log on
Just to check if i,ve got a new friend
And then to the messages from all round the world
Games to play and replies to send
Some days i chat when i,m working
Dont tell Lisa she thinks i,m a saint!
But i,m under the radar she has no idea
And so far there,s been no complaint
How was your weekend babe is Monday,s question
Spent with my loved ones i say
Glad you enjoyed it they all seem to care
Humbling to be checked on each day
You wouldnt believe the topics i cover
Pine Martens,Subuteo and comets!
Films and songs, how often i shave!
Coffee, creamcakes and comics
The marriage proposals about three a week
I,m flattered but guys i,m not ready
My life is here in my little world
Starfishing each night with my teddies
I love the games we play together
Words and quizzes and pool
Win some, i lose some but thats ok
I must,ve learned some thing in school
Sometimes a picture appears in my inbox
Male anatomy and i strain my eyes
What thoughtful guys that,s just what i wanted!
What a shame about the size!
My trans friends make up most of my list
Special people i cant be without
I follow their journey,s and i always will
Forever friends of that there,s no doubt
Some drop in now and again
Some are with me each day
Some have travelled my saddest road
And some i just met today
A few i feel i,ve known forever
Some i really wish i had
Always there when i need them
Through the good times and the bad
Can you love someone you,ve never met?
I assure you that i do
Poets, artists, mum,s and dad,s
All show me a love that,s true
I share your pain and sadness
The past things you cant erase
I wish i could take it all away
And give you only brighter days
But all of you were strangers when we started on this path
As time goes by we get closer with each day
So i want to say thanks to every one of you
For choosing to send your friendship my way xx`
            },
            {
                title: "How much do I miss you",
                body: `How much do I miss you?
Can I even find the words?
How do I describe a grief 
That's bigger than the universe?
Like the swan that bows his weary head 
As he mourns his lifelong love 
Perhaps one day they'll fly again 
Over the rainbow bridge above 
The autumn branches know my pain 
When their last leaves gently fall 
Trees now cold and naked 
Waiting for spring's long distant call 
I long for you like the early bees 
Miss their dance as the daffodils die 
Why can't beauty live forever?
When will my tears dry?
Send me a sign, show me the way 
Let me know my life's not in vain 
Hold me in your soft embrace 
Please take away this pain 
And when my story comes to it's end
When my time on earth is through 
I pray I'll find eternity 
And spend every day with you 💔`
            }
        ];

        function renderGallery() {
            const container = document.getElementById('gallery');
            container.innerHTML = poems.map((p, index) => `
                <div class="poem-tile" onclick="openPoem(${index})">
                    <div class="image-placeholder">Illustration for "${p.title}"</div>
                    <div class="tile-title">${p.title}</div>
                </div>
            `).join('');
        }

        function openPoem(index) {
            const poem = poems[index];
            const view = document.getElementById('full-poem-view');
            view.innerHTML = `<h2>${poem.title}</h2><br>${poem.body}`;
            document.getElementById('overlay').style.display = 'block';
            document.body.style.overflow = 'hidden'; 
        }

        function closePoem() {
            document.getElementById('overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        renderGallery();
    </script>
</body>
</html>
