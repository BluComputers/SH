    <!-- Google Fonts for handwriting title & signature -->

    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Sacramento&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffe6f0 0%, #ffd1dc 50%, #fbcfe8 100%);
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: #4a2c3a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 60px 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title Style */
        .main-title {
            font-family: 'Alex Brush', cursive;
            font-size: 4.2rem;
            color: #702646;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.6);
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
            line-height: 1.1;
        }

        /* Circular Image Frame */
        .image-frame {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            overflow: hidden;
            border: 6px solid #ffffff;
            box-shadow: 0 10px 25px rgba(186, 85, 126, 0.25);
            margin-bottom: 15px;
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Signature Style */
        .signature {
            font-family: 'Sacramento', cursive;
            font-size: 2.8rem;
            color: #8b3a62;
            margin-bottom: 45px;
            text-align: center;
        }

        /* Buttons Grid: 4 Columns */
        .archive-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        .archive-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #ffffff 0%, #fff0f5 100%);
            border: 2px solid #f2a6c8;
            border-radius: 25px;
            padding: 14px 18px;
            color: #702646;
            font-size: 1.05rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(186, 85, 126, 0.12);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .archive-btn:hover {
            transform: translateY(-4px) scale(1.02);
            background: linear-gradient(135deg, #fff0f5 0%, #fbe3ed 100%);
            border-color: #d87093;
            box-shadow: 0 8px 20px rgba(186, 85, 126, 0.25);
        }

        .butterfly-icon {
            font-size: 1.3rem;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .archive-btn:hover .butterfly-icon {
            transform: rotate(-12px) scale(1.15);
        }

        /* Responsive Layouts */
        @media (max-width: 850px) {
            .archive-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .main-title {
                font-size: 3.4rem;
            }
        }

        @media (max-width: 480px) {
            .archive-grid {
                grid-template-columns: 1fr;
            }
            .main-title {
                font-size: 2.8rem;
            }
            .image-frame {
                width: 180px;
                height: 180px;
            }
            .signature {
                font-size: 2.3rem;
            }
        }
    </style>
